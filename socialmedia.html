    <style>
        /* Social Media Box */
        #social-media {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background-color: #f9f9f9;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        /* Section Title */
        #social-media h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #social-media p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 30px;
        }

        /* Social Icons Container */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* Social Icon Style */
        .social-icon img {
            width: 50px;
            height: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .social-icon img:hover {
            transform: scale(1.2);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 480px) {
            .social-icon img {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
